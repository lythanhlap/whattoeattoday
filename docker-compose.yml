services:
  postgres:
    image: postgres:16-alpine
    container_name: recipe-community-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recipe_community
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recipe-community-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: recipe-community-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - recipe-community-redis-data:/data

  media-cleanup-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recipe_community
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_MAX_FILE_SIZE: ${CLOUDINARY_MAX_FILE_SIZE:-5242880}
    depends_on:
      - postgres
      - redis

volumes:
  recipe-community-postgres-data:
  recipe-community-redis-data:
